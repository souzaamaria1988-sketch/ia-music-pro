name: Treinar Modelo

on:
  workflow_dispatch:
    inputs:
      max_songs:
        description: 'Máximo de músicas para treinar (0 = todas)'
        required: false
        default: '100'
      force_redownload:
        description: 'Forçar novo download do dataset'
        required: false
        default: 'false'

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache de dependências Python
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache do dataset Hugging Face
      uses: actions/cache@v4
      with:
        path: |
          datasets/hf_cache
          datasets/suno-ai-music-dataset
        key: ${{ runner.os }}-suno-dataset-v1
        restore-keys: |
          ${{ runner.os }}-suno-dataset-

    - name: Cache de modelos treinados
      uses: actions/cache@v4
      with:
        path: |
          models
          memory
        key: ${{ runner.os }}-models-v1
        restore-keys: |
          ${{ runner.os }}-models-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar cache do dataset
      id: dataset_check
      run: |
        if [ -f "datasets/suno-ai-music-dataset/metadata.json" ] && [ "${{ github.event.inputs.force_redownload }}" != "true" ]; then
          echo "cached=true" >> $GITHUB_OUTPUT
          echo "✓ Dataset encontrado no cache"
        else
          echo "cached=false" >> $GITHUB_OUTPUT
          echo "Dataset não encontrado - será baixado"
        fi

    - name: Baixar dataset (se não estiver em cache)
      if: steps.dataset_check.outputs.cached == 'false'
      run: |
        python download_dataset.py \
          --max-songs ${{ github.event.inputs.max_songs }}

    - name: Mostrar estatísticas do dataset
      run: |
        python download_dataset.py --stats-only

    - name: Atualizar knowledge_base.json
      run: |
        python download_dataset.py --update-knowledge

    - name: Treinar modelo
      run: |
        python train.py \
          --dataset datasets/suno-ai-music-dataset/metadata.json \
          --epochs 20 \
          --batch-size 8

    - name: Salvar artefatos de treinamento
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          models/
          memory/
          knowledge_base.json
        if-no-files-found: warn

    - name: Commit knowledge_base atualizado
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add knowledge_base.json
        git diff --quiet && git diff --staged --quiet || \
          git commit -m "chore: atualiza knowledge_base com dataset Suno" && \
          git push
