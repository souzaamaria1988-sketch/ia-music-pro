name: Treinar Autoencoder (10.000 épocas - LINUX)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Épocas (padrão 10000)"
        required: false
        default: "10000"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install numpy scipy soundfile

    - name: Train Autoencoder
      env:
        EPOCHS: ${{ github.event.inputs.epochs }}
      run: |
        echo "🧠 Treinando Autoencoder ($EPOCHS épocas)..."
        python train.py --epochs $EPOCHS --batch-size 64

    - name: Commit Models
      run: |
        git config --local user.email "train-bot@github.com"
        git config --local user.name "Train Bot"
        git add models/
        if git diff --staged --quiet; then
          echo "Nada para commitar"
        else
          git commit -m "🧠 Autoencoder treinado: $(date)"
          git pull --rebase origin main || true
          git push
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autoencoder-model
        path: models/autoencoder/
        retention-days: 90
