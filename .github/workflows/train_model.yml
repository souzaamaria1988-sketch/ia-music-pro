name: Treinar Modelo (5000 épocas)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Número de épocas (mínimo 5000)"
        required: false
        default: "5000"
      layers:
        description: "Número de camadas (padrão 50)"
        required: false
        default: "50"
      batch_size:
        description: "Batch size"
        required: false
        default: "32"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install numpy scipy soundfile

    - name: Train Model
      env:
        EPOCHS: ${{ github.event.inputs.epochs }}
        LAYERS: ${{ github.event.inputs.layers }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        echo "=========================================="
        echo "  TREINAMENTO EXTREMO"
        echo "  Épocas: $EPOCHS"
        echo "  Camadas: $LAYERS"
        echo "  Batch: $BATCH_SIZE"
        echo "=========================================="
        python train.py --epochs $EPOCHS --layers $LAYERS --batch-size $BATCH_SIZE

    - name: Show Results
      run: |
        echo "📁 Modelos salvos:"
        ls -la models/ 2>/dev/null || echo "Nenhum modelo"
        echo ""
        if [ -f models/training_log.json ]; then
          echo "📊 Log de treino:"
          cat models/training_log.json
        fi

    - name: Commit Model
      run: |
        git config --local user.email "train-bot@github.com"
        git config --local user.name "Train Bot"
        git add models/
        if git diff --staged --quiet; then
          echo "Nada para commitar"
        else
          git commit -m "🧠 Modelo treinado: $(date '+%Y-%m-%d %H:%M')"
          git push
        fi

    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: models/
        retention-days: 90
