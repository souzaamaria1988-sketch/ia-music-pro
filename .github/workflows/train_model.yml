name: Treinar Modelo

on:
  workflow_dispatch:
    inputs:
      max_songs:
        description: 'Máximo de músicas para treinar (0 = todas)'
        required: false
        default: '100'
      dataset_mode:
        description: 'Modo do dataset (suno, synthetic, mixed)'
        required: false
        default: 'mixed'
      epochs:
        description: 'Número de épocas'
        required: false
        default: '1000'
      patience:
        description: 'Épocas sem melhora antes do early stopping'
        required: false
        default: '50'
      force_redownload:
        description: 'Forçar novo download do dataset'
        required: false
        default: 'false'

permissions:
  contents: write   # ← ESSENCIAL: corrige o 403 no push

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4   # persiste o GITHUB_TOKEN no git por padrão

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache de dependências Python
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Cache do dataset Hugging Face
      id: dataset_cache        # ← id necessário para outputs.cache-hit existir
      uses: actions/cache@v4
      with:
        path: |
          datasets/hf_cache
          datasets/suno-ai-music-dataset
        # Chave por volume de dados; se force_redownload, chave única por run
        # (garante que o refresh também seja salvo no cache no fim do job)
        key: ${{ runner.os }}-suno-${{ github.event.inputs.max_songs || '100' }}-${{ github.event.inputs.force_redownload == 'true' && github.run_id || 'v1' }}

    - name: Cache de modelos treinados e memória
      uses: actions/cache@v4
      with:
        path: |
          models
          memory
        # Chave ÚNICA por run (o cache só salva em key miss — com chave
        # estática 'models-v1' o novo modelo nunca era salvo) + bump v2
        # porque o schema de features mudou (10 → 17 dimensões)
        key: ${{ runner.os }}-models-v2-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-models-v2

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Baixar dataset (se não estiver em cache)
      if: steps.dataset_cache.outputs.cache-hit != 'true' || github.event.inputs.force_redownload == 'true'
      run: |
        python download_dataset.py --max-songs ${{ github.event.inputs.max_songs }}

    - name: Treinar modelo
      run: |
        python train.py \
          --dataset ${{ github.event.inputs.dataset_mode }} \
          --max-songs ${{ github.event.inputs.max_songs }} \
          --epochs ${{ github.event.inputs.epochs }} \
          --patience ${{ github.event.inputs.patience }} \
          --batch-size 8

    - name: Commit e push dos resultados
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add knowledge_base.json
        # Se quiser o relatório de treino versionado (memory/ é gitignored):
        # git add -f memory/training_report.json memory/training_history.json
        if git diff --cached --quiet; then
          echo "Nenhuma mudança para commitar."
        else
          git commit -m "chore: atualiza knowledge_base e modelo após treino"
          git pull --rebase origin main
          git push
        fi
