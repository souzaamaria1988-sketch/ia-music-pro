name: Treinar Modelo (10.000 épocas completas)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Épocas (padrão 10000)"
        required: false
        default: "10000"
      early_stopping:
        description: "Ativar early stopping?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 horas máximo

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install numpy scipy soundfile

    - name: Train Autoencoder (Complete)
      env:
        EPOCHS: ${{ github.event.inputs.epochs }}
        EARLY_STOPPING: ${{ github.event.inputs.early_stopping }}
      run: |
        echo "=========================================="
        echo "  🧠 TREINAMENTO COMPLETO"
        echo "  Épocas: $EPOCHS"
        echo "  Early stopping: $EARLY_STOPPING"
        echo "=========================================="
        
        if [ "$EARLY_STOPPING" = "true" ]; then
          python train.py --epochs $EPOCHS --early-stopping
        else
          python train.py --epochs $EPOCHS
        fi

    - name: Show Results
      run: |
        echo "📊 Resultados:"
        if [ -f models/autoencoder/training_log.json ]; then
          cat models/autoencoder/training_log.json
        fi

    - name: Commit Models
      run: |
        git config --local user.email "train-bot@github.com"
        git config --local user.name "Train Bot"
        git add models/
        if git diff --staged --quiet; then
          echo "Nada para commitar"
        else
          git commit -m "🧠 Autoencoder treinado: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autoencoder-model
        path: models/autoencoder/
        retention-days: 90
