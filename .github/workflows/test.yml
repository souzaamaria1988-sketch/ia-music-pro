name: Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Compilar todos os arquivos Python
      run: python -m compileall .
    - name: Executar testes
      run: python -m unittest discover -s tests -v
    - name: Testar listagem de instrumentos
      run: python music_generator.py --list-instruments
    - name: Testar listagem de famílias
      run: python music_generator.py --list-families
    - name: Testar geração com fallback
      run: python music_generator.py --prompt "samba com cavaquinho, pandeiro e surdo" --duration 5 --no-soundfont
