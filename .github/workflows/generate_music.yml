name: Gerar Música (com Feedback Loop)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt em português"
        required: false
        default: ""
      style:
        description: "Estilo musical"
        required: false
        default: "pop"
      duration:
        description: "Duração"
        required: false
        default: "45"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install numpy scipy soundfile

    - name: Generate Music (with Feedback Loop)
      env:
        PROMPT: ${{ github.event.inputs.prompt }}
        STYLE: ${{ github.event.inputs.style }}
        DURATION: ${{ github.event.inputs.duration }}
      run: |
        mkdir -p song_output memory
        python music_generator.py --prompt "$PROMPT" --style "$STYLE" --duration "$DURATION" --batch

    - name: Commit
      run: |
        git config --local user.email "bot@github.com"
        git config --local user.name "Music Bot"
        git add song_output/ memory/
        if git diff --staged --quiet; then
          echo "Nada para commitar"
        else
          git commit -m "🎵 Música + Memórias: $(date)"
          git pull --rebase origin main || true
          git push
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-output
        path: |
          song_output/
          memory/
        retention-days: 30
