name: Gerar Música

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt em português'
        required: true
        default: 'música cinematográfica com piano e violino'
      style:
        description: 'Estilo musical'
        required: false
        default: 'cinematic'
      duration:
        description: 'Duração em segundos'
        required: false
        default: '30'
      use_soundfont:
        description: 'Usar SoundFont'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Instalar FluidSynth
      run: sudo apt-get update && sudo apt-get install -y fluidsynth || true
    - name: Verificar SoundFont
      id: soundfont
      run: |
        if [ -f "soundfonts/default.sf2" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    - name: Gerar música
      run: |
        SOUND_FLAG=""
        if [ "${{ github.event.inputs.use_soundfont }}" == "true" ] && [ "${{ steps.soundfont.outputs.exists }}" == "true" ]; then
          SOUND_FLAG="--soundfont soundfonts/default.sf2"
        else
          SOUND_FLAG="--no-soundfont"
        fi
        python music_generator.py \
          --prompt "${{ github.event.inputs.prompt }}" \
          --style "${{ github.event.inputs.style }}" \
          --duration ${{ github.event.inputs.duration }} \
          $SOUND_FLAG
    - name: Publicar artefatos
      uses: actions/upload-artifact@v4
      with:
        name: generated-music
        path: |
          song_output/*.wav
          song_output/*.mid
          song_output/*.json
        if-no-files-found: warn
