name: Gerar Música (RAG+MoE)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt em português"
        required: false
        default: ""
      style:
        description: "Estilo"
        required: false
        default: "epic"
        type: choice
        options: [epic, bossfight, dark, rock, ambient, electronic, jazz, classical, breakcore]
      duration:
        description: "Duração (segundos)"
        required: false
        default: "45"
        type: choice
        options: ["30", "45", "60", "90"]
      count:
        description: "Quantidade"
        required: false
        default: "1"
        type: choice
        options: ["1", "2", "3", "5"]
      use_rag:
        description: "Usar RAG?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install numpy scipy soundfile

    - name: Generate Music
      env:
        PROMPT: ${{ github.event.inputs.prompt }}
        STYLE: ${{ github.event.inputs.style }}
        DURATION: ${{ github.event.inputs.duration }}
        COUNT: ${{ github.event.inputs.count }}
        USE_RAG: ${{ github.event.inputs.use_rag }}
      run: |
        mkdir -p song_output
        for i in $(seq 1 $COUNT); do
          echo "=== Música $i de $COUNT ==="
          if [ -n "$PROMPT" ]; then
            python music_generator.py --prompt "$PROMPT" --duration "$DURATION" --use-rag $USE_RAG --batch
          else
            python music_generator.py --style "$STYLE" --duration "$DURATION" --use-rag $USE_RAG --batch
          fi
        done

    - name: Commit Songs
      run: |
        git config --local user.email "music-bot@github.com"
        git config --local user.name "Music Bot"
        git add song_output/
        if git diff --staged --quiet; then echo "Nada para commitar"; else
          git commit -m "🎵 Músicas RAG+MoE: $(date '+%Y-%m-%d %H:%M')"
          git push
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generated-songs
        path: song_output/
        retention-days: 30
