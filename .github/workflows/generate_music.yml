name: Gerar Música (Linux)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt em português"
        required: false
        default: ""
      style:
        description: "Estilo (100+ disponíveis)"
        required: false
        default: "epic"
      duration:
        description: "Duração"
        required: false
        default: "45"
      remix:
        description: "Número da música para remixar (vazio = gerar nova)"
        required: false
        default: ""
      remix_type:
        description: "Tipo de remix"
        required: false
        default: "variations"
        type: choice
        options: [variations, style_change, speed_up, slow_down, acoustic, electronic, heavy, soft]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install numpy scipy soundfile
    - name: Generate or Remix
      env:
        PROMPT: ${{ github.event.inputs.prompt }}
        STYLE: ${{ github.event.inputs.style }}
        DURATION: ${{ github.event.inputs.duration }}
        REMIX: ${{ github.event.inputs.remix }}
        REMIX_TYPE: ${{ github.event.inputs.remix_type }}
      run: |
        mkdir -p song_output
        if [ -n "$REMIX" ]; then
          python music_generator.py --remix "$REMIX" --remix-type "$REMIX_TYPE" --style "$STYLE" --batch
        elif [ -n "$PROMPT" ]; then
          python music_generator.py --prompt "$PROMPT" --duration "$DURATION" --use-rag true --batch
        else
          python music_generator.py --style "$STYLE" --duration "$DURATION" --use-rag true --batch
        fi
    - name: Commit
      run: |
        git config user.email "bot@github.com"
        git config user.name "Music Bot"
        git add song_output/
        git commit -m "🎵 Música: $(date)" || true
        git pull --rebase origin main || true
        git push
